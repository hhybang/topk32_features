<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BatchTopK32 Feature Figures and Metadata</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      font-size: 13px;
    }
    .features-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .feature {
      display: flex;
      flex-direction: row;
      gap: 20px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 30px;
    }
    .left-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chart img {
      width: 100%;
      height: auto;
      max-height: 300px;
      object-fit: contain;
    }
    .metadata {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #ddd;
    }
    .metadata p {
      margin: 0;
    }
    .metadata .bold {
      font-weight: bold;
    }
    .right-col {
      flex: 1;
      overflow-x: auto;
    }
    .token-block {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 20px;
    }
    .token-set {
      min-width: 200px;
      border: 1px solid #ccc;
      padding: 10px;
      background-color: #fafafa;
      border-radius: 5px;
    }
    .tokens {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .token {
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      position: relative;
    }
    .token::after {
      content: attr(data-value);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 11px;
      white-space: nowrap;
      display: none;
      pointer-events: none;
      z-index: 10;
    }
    .token:hover::after {
      display: block;
    }
    .chart-thumb {
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>BatchTopK32 Feature Figures and Metadata</h1>
  <div class="features-container" id="features-container"></div>
  <script>
    function getColorForValue(value, max) {
      const alpha = Math.max(0.1, Math.min(1, value / max));
      return `rgba(0, 0, 0, ${alpha})`;
    }

    let features = [];
    let currentIndex = 0;
    const batchSize = 10;
    const container = document.getElementById('features-container');

    function renderNextBatch() {
      const end = Math.min(currentIndex + batchSize, features.length);
      for (let i = currentIndex; i < end; i++) {
        const f = features[i];
        const div = document.createElement('div');
        div.className = 'feature';

        const leftCol = document.createElement('div');
        leftCol.className = 'left-col';
        const chartDiv = document.createElement('div');
        chartDiv.className = 'chart';
        chartDiv.innerHTML = `<img loading="lazy" src="stacked_figures/feature_${f.feature_idx}.png" alt="Feature ${f.feature_idx}">`;

        const metadata = document.createElement('div');
        metadata.className = 'metadata';
        metadata.innerHTML = `
          <p><span class="bold">Feature</span>: ${f.feature_idx}</p>
          <p><span class="bold">Mode Token</span>: ${f.most_common_token || 'N/A'} (${f.most_common_ratio || 'N/A'})</p>
          <p><span class="bold">Charts Seen</span>: ${f.n_charts_seen || 'N/A'}</p>
          <p><span class="bold">Token Position</span>: ${(f.token_positions && Object.entries(f.token_positions).map(([k,v]) => `${k} (${v})`).join(', ')) || 'N/A'}</p>
          <p><span class="bold">Chart Types</span>: ${(f.chart_type_freq && Object.entries(f.chart_type_freq).map(([k,v]) => `${k} (${v})`).join(', ')) || 'N/A'}</p>
          <p><span class="bold">X Types</span>: ${(f.x_type_freq && Object.entries(f.x_type_freq).map(([k,v]) => `${k} (${v})`).join(', ')) || 'N/A'}</p>
          <p><span class="bold">Y Types</span>: ${(f.y_type_freq && Object.entries(f.y_type_freq).map(([k,v]) => `${k} (${v})`).join(', ')) || 'N/A'}</p>
        `;
        leftCol.appendChild(chartDiv);
        leftCol.appendChild(metadata);

        const rightCol = document.createElement('div');
        rightCol.className = 'right-col';
        const tokenBlock = document.createElement('div');
        tokenBlock.className = 'token-block';

        (f.context_examples_list || []).forEach(ctx => {
          const tokenSet = document.createElement('div');
          tokenSet.className = 'token-set';

          const chartImage = document.createElement('img');
          chartImage.className = 'chart-thumb';
          chartImage.loading = 'lazy';
          chartImage.src = `images/${ctx.chart_idx}.png`;
          chartImage.alt = `Chart ${ctx.chart_idx}`;
          tokenSet.appendChild(chartImage);

          const maxVal = Math.max(...ctx.values);
          const tokenRow = document.createElement('div');
          tokenRow.className = 'tokens';

          ctx.tokens.forEach((token, i) => {
            const span = document.createElement('span');
            span.className = 'token';
            span.textContent = token;
            span.setAttribute('data-value', ctx.values[i]);
            span.style.backgroundColor = getColorForValue(ctx.values[i], maxVal);
            span.style.color = ctx.values[i] > maxVal * 0.5 ? 'white' : 'black';
            tokenRow.appendChild(span);
          });

          tokenSet.appendChild(tokenRow);
          tokenBlock.appendChild(tokenSet);
        });

        rightCol.appendChild(tokenBlock);
        div.appendChild(leftCol);
        div.appendChild(rightCol);
        container.appendChild(div);
      }
      currentIndex = end;
    }

    fetch("https://huggingface.co/datasets/hhybang/vistext_sae_features/resolve/main/processed_features.json")
      .then(res => res.json())
      .then(data => {
        features = data;
        renderNextBatch();
      });

    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        renderNextBatch();
      }
    });
  </script>
</body>
</html>
