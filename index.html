<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BatchTopK32 SAE: Feature Figures and Metadata</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; font-size: 13px; }
    h1 { text-align: center; margin-bottom: 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .filters input, .filters select { padding: 5px; font-size: 13px; }
    .features-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 20px;
    }
    .feature { display: flex; flex-direction: column; border-bottom: 1px solid #ccc;
               padding: 10px; background: #fff; overflow: hidden; }
    .chart-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; text-align: center; }
    .chart img { width: 100%; max-height: 200px; object-fit: contain; display: block; margin: 0 auto 10px; }
    .meta { display: flex; justify-content: space-between; gap: 10px; }
    .meta-col { flex: 1; padding: 0 5px; }
    ul { list-style: disc; padding-left: 20px; margin: 4px 0; }
    .bold { font-weight: bold; }
    .context-block { max-height: 80px; overflow-y: auto; border: 1px solid #ccc;
                     padding: 5px; background: #fafafa; margin-bottom: 10px; }
    .context-token { display: inline-block; margin: 2px; padding: 2px 4px;
                     border-radius: 3px; font-size: 12px; }
    .context-example {
      position: relative; display: inline-block; margin-right: 8px;
    }
    .context-example img {
      display: none; position: absolute; top: 100%; left: 0;
      width: 200px; border: 1px solid #ccc; background: #fff; z-index: 100;
    }
    .context-example:hover img { display: block; }
  </style>
</head>
<body>
  <h1>BatchTopK32 Feature Figures and Metadata</h1>

  <div class="filters">
    <input type="text" id="tokenSearch" placeholder="Search Token">
    <select id="chartFilter">
      <option value="">All Chart Types</option>
      <option value="bar">Bar</option>
      <option value="area">Area</option>
      <option value="line">Line</option>
    </select>
    <select id="xFilter">
      <option value="">All X Types</option>
      <option value="numeric">Numeric</option>
      <option value="datetime">Datetime</option>
      <option value="string">String</option>
      <option value="other">Other</option>
    </select>
    <select id="yFilter">
      <option value="">All Y Types</option>
      <option value="numeric">Numeric</option>
      <option value="datetime">Datetime</option>
      <option value="string">String</option>
      <option value="other">Other</option>
    </select>
    <select id="trendFilter">
      <option value="">All Trends</option>
      <option value="increasing">Increasing</option>
      <option value="decreasing">Decreasing</option>
      <option value="other">Other</option>
    </select>
    <select id="tokenPositionFilter">
      <option value="">All Token Positions</option>
      <option value="title">Title</option>
      <option value="axis">Axis</option>
      <option value="value">Value</option>
    </select>
  </div>

  <div class="features-container" id="features-container"></div>

  <script>
    let summary = [], details = null;
    const container = document.getElementById('features-container');

    // 1) Load summary JSON for instant filtering & rendering
    fetch('features_summary.json')
      .then(r => r.json())
      .then(data => {
        summary = data;
        renderBatch(summary);
        // 2) Then load the full details in the background
        return fetch('features_details.json');
      })
      .then(r => r.json())
      .then(d => {
        details = d;
        // fill context blocks for already-rendered cards
        document.querySelectorAll('.feature').forEach(fillContext);
      })
      .catch(console.error);

    // Render up to `batchSize` cards from `list`, starting at `start`
    const batchSize = 50;
    function renderBatch(list, start = 0) {
      const end = Math.min(start + batchSize, list.length);
      for (let i = start; i < end; i++) {
        container.appendChild(createCard(list[i]));
      }
      if (end < list.length && !isFiltering()) {
        window.addEventListener('scroll', onScroll);
      }
    }
    function onScroll() {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
        window.removeEventListener('scroll', onScroll);
        renderBatch(summary, container.children.length);
      }
    }

    function isFiltering() {
      return !!(
        document.getElementById("chartFilter").value ||
        document.getElementById("xFilter").value ||
        document.getElementById("yFilter").value ||
        document.getElementById("trendFilter").value ||
        document.getElementById("tokenSearch").value ||
        document.getElementById("tokenPositionFilter").value
      );
    }

    function applyFilters() {
      container.innerHTML = '';
      let filtered = summary.filter(matchAllFilters);
      filtered.sort((a,b) => getPct(b) - getPct(a));
      renderBatch(filtered);
    }

    function matchAllFilters(f) {
      const cf = document.getElementById("chartFilter").value;
      const xf = document.getElementById("xFilter").value;
      const yf = document.getElementById("yFilter").value;
      const tf = document.getElementById("trendFilter").value;
      const ts = document.getElementById("tokenSearch").value.toLowerCase();
      const pf = document.getElementById("tokenPositionFilter").value;
      const ftChart = f.chart_type_modes.map(x=>x.toLowerCase()).join(',');
      const ftX     = f.x_type_modes.map(x=>x.toLowerCase()).join(',');
      const ftY     = f.y_type_modes.map(x=>x.toLowerCase()).join(',');
      const ftTrend = f.trend_modes.map(x=>x.toLowerCase()).join(',');
      const ftToken = f.most_common_token.toLowerCase();
      const ftPos   = (f.token_positions_modes||[]).map(x=>x.toLowerCase());
      return (!cf || ftChart.includes(cf))
          && (!xf || ftX.includes(xf))
          && (!yf || ftY.includes(yf))
          && (!tf || ftTrend.includes(tf))
          && (!ts || ftToken.includes(ts))
          && (!pf || ftPos.includes(pf));
    }

    function getPct(f) {
      const cf = document.getElementById("chartFilter").value;
      const xf = document.getElementById("xFilter").value;
      const yf = document.getElementById("yFilter").value;
      const tf = document.getElementById("trendFilter").value;
      const pf = document.getElementById("tokenPositionFilter").value;
      const ts = document.getElementById("tokenSearch").value ? 'search' : null;
      if (cf) return parseInt(f.chart_type_freq[cf]||0);
      if (xf) return parseInt(f.x_type_freq[xf]||0);
      if (yf) return parseInt(f.y_type_freq[yf]||0);
      if (tf) return parseInt(f.trend_freq[tf]||0);
      if (pf) return parseInt(f.token_positions[pf]||0);
      if (ts) return parseInt(f.most_common_ratio||0);
      return 0;
    }

    function createCard(f) {
      const div = document.createElement('div');
      div.className = 'feature';
      div.dataset.featureIdx = f.feature_idx;

      // build the inner HTML from summary fields
      div.innerHTML = `
        <div class="chart-title">Feature ${f.feature_idx}</div>
        <img loading="lazy" src="stacked_figures/feature_${f.feature_idx}.png" alt="">
        <div class="meta">
          <div class="meta-col">
            <p>Mode Token: <span class="bold">${f.most_common_token}</span> (${f.most_common_ratio})</p>
            <p>Token Position:</p>
            <ul>${Object.entries(f.token_positions||{})
              .map(([p,pc]) => `<li>${p}: ${pc}</li>`).join('')}</ul>
            <p>Context Tokens:</p>
            <div class="context-block"></div>
          </div>
          <div class="meta-col">
            <p>Chart Types:</p>
            <ul>${Object.entries(f.chart_type_freq)
              .map(([k,v]) => `<li>${k}: ${v}</li>`).join('')}</ul>
            <p>Trends:</p>
            <ul>${Object.entries(f.trend_freq)
              .map(([k,v]) => `<li>${k}: ${v}</li>`).join('')}</ul>
          </div>
          <div class="meta-col">
            <p>X Types:</p>
            <ul>${Object.entries(f.x_type_freq)
              .map(([k,v]) => `<li>${k}: ${v}</li>`).join('')}</ul>
            <p>Y Types:</p>
            <ul>${Object.entries(f.y_type_freq)
              .map(([k,v]) => `<li>${k}: ${v}</li>`).join('')}</ul>
          </div>
        </div>`;

      // if details already loaded, fill context immediately
      if (details) fillContext(div);
      return div;
    }

    function fillContext(div) {
      const idx = div.dataset.featureIdx;
      const ctxs = details[idx] && details[idx].context_dict;
      const cb = div.querySelector('.context-block');
      cb.innerHTML = '';
      if (!ctxs) return;
      Object.values(ctxs).forEach(ctx => {
        const wrapper = document.createElement('div');
        wrapper.className = 'context-example';
        const maxV = Math.max(...ctx.values);
        ctx.tokens.forEach((t,i) => {
          const a = maxV ? ctx.values[i]/maxV : 0;
          const span = document.createElement('span');
          span.className = 'context-token';
          span.textContent = t;
          span.style.backgroundColor = `rgba(0,0,0,${a})`;
          span.style.color = a>0.5 ? 'white' : 'black';
          wrapper.appendChild(span);
        });
        const img = document.createElement('img');
        img.src = `images/${ctx.chart_idx}.png`; // adjust path as needed
        wrapper.appendChild(img);

        cb.appendChild(wrapper);
        const hr = document.createElement('hr');
        hr.style.border='none'; hr.style.borderTop='1px solid #eee';
        cb.appendChild(hr);
      });
    }

    // wire up filters
    document.getElementById("tokenSearch").addEventListener("input", applyFilters);
    document.querySelectorAll(".filters select")
      .forEach(el => el.addEventListener("change", applyFilters));
  </script>
</body>
</html>
