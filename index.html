<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BatchTopK SAE Features on VisText</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      font-size: 13px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .filters input,
    .filters select {
      padding: 5px;
      font-size: 13px;
    }
    .features-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .feature {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 30px;
    }
    .feature-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .feature-body {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: stretch;
    }
    .left-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chart img {
      width: 100%;
      height: auto;
      max-height: 300px;
      object-fit: contain;
    }
    .metadata {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #ddd;
    }
    .metadata p {
      margin: 0;
    }
    .metadata .bold {
      font-weight: bold;
    }
    .right-col {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      border-left: 2px solid #eee;
      padding-left: 10px;
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }
    .feature-body > .left-col,
    .feature-body > .right-col {
      height: auto;
    }
    .token-block {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: max-content;
      padding-bottom: 8px;
      flex-wrap: nowrap;
    }
    .token-set {
      flex: 0 0 auto;
      width: 200px;
      border: 1px solid #ccc;
      padding: 10px;
      background-color: #fafafa;
      border-radius: 5px;
    }
    .tokens {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
    }
    .token {
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      position: relative;
    }
    .token::after {
      content: attr(data-value);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 11px;
      white-space: nowrap;
      display: none;
      pointer-events: none;
      z-index: 10;
    }
    .token:hover::after {
      display: block;
    }
    .chart-thumb {
      width: 100%;
      max-height: 160px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>BatchTopK SAE Features on VisText</h1>

  <div class="filters">
    <input type="text" id="featureSearch" placeholder="Search Feature #">
    <input type="number" id="ratioFilter" placeholder="Max mode %" min="0" max="100" style="width: 80px;">

    <select id="chartFilter">
      <option value="">All Chart Types</option>
      <option value="bar">Bar</option>
      <option value="area">Area</option>
      <option value="line">Line</option>
    </select>
    <select id="xFilter">
      <option value="">All X Types</option>
      <option value="numeric">Numeric</option>
      <option value="datetime">Datetime</option>
      <option value="string">String</option>
      <option value="other">Other</option>
    </select>
    <select id="yFilter">
      <option value="">All Y Types</option>
      <option value="numeric">Numeric</option>
      <option value="datetime">Datetime</option>
      <option value="string">String</option>
      <option value="other">Other</option>
    </select>
    <select id="tokenPositionFilter">
      <option value="">All Token Positions</option>
      <option value="title">Title</option>
      <option value="axis">Axis</option>
      <option value="value">Value</option>
    </select>
  </div>

  <div class="features-container" id="features-container"></div>

  <script>
    function getColorForValue(value, max) {
      const alpha = Math.max(0.1, Math.min(1, value / max));
      return `rgba(0, 0, 0, ${alpha})`;
    }

    let features = [];
    let filteredFeatures = [];
    let currentIndex = 0;
    const batchSize = 10;
    const container = document.getElementById('features-container');

    function matchValue(dataValue, filterValue) {
      const vals = dataValue.split(',').map(v => v.trim());
      return !filterValue || vals.includes(filterValue);
    }

    function updateFilteredFeatures() {
      const featureSearch = document.getElementById("featureSearch").value;
      const chartType   = document.getElementById("chartFilter").value;
      const xType       = document.getElementById("xFilter").value;
      const yType       = document.getElementById("yFilter").value;
      const tokenPos    = document.getElementById("tokenPositionFilter").value;
      const ratioThreshold  = document.getElementById("ratioFilter").value;

      filteredFeatures = features.filter(f => {
        if (featureSearch && f.feature_idx.toString() !== featureSearch.trim()) return false;
        if (ratioThreshold && parseInt(f.most_common_ratio, 10) >= parseInt(ratioThreshold, 10)) return false;

        const ftChart = (f.chart_type_modes || []).map(x => x.toLowerCase()).join(',');
        const ftX     = (f.x_type_modes || []).map(x => x.toLowerCase()).join(',');
        const ftY     = (f.y_type_modes || []).map(x => x.toLowerCase()).join(',');
        const ftPos   = (f.token_positions_modes || []).map(x => x.toLowerCase());

        return matchValue(ftChart, chartType)
          && matchValue(ftX, xType)
          && matchValue(ftY, yType)
          && (!tokenPos || ftPos.includes(tokenPos));
      });

      currentIndex = 0;
      container.innerHTML = '';
      renderNextBatch();
    }

    function renderNextBatch() {
      const end = Math.min(currentIndex + batchSize, filteredFeatures.length);
      for (let i = currentIndex; i < end; i++) {
        const f = filteredFeatures[i];
        // ... [rendering logic remains the same] ...
      }
      currentIndex = end;
    }

    async function loadChunksSequentially() {
      const urls = [
        "features_1.json",
        "features_2.json",
        "features_3.json",
        "features_4.json",
        "features_5.json",
        "features_6.json",
        "features_7.json",
        "features_8.json"
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url);
          const chunk = await res.json();
          features = features.concat(chunk);
        } catch (err) {
          console.error(`❌ Failed to fetch ${url}:`, err);
        }
      }
      updateFilteredFeatures();
    }

    document.getElementById("featureSearch").addEventListener("input", updateFilteredFeatures);
    document.getElementById("ratioFilter").addEventListener("input", updateFilteredFeatures);
    document.querySelectorAll(".filters select")
      .forEach(s => s.addEventListener("change", updateFilteredFeatures));

    loadChunksSequentially();

    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        renderNextBatch();
      }
    });
  </script>
</body>
</html>
